datasets:
  - Cora
  - CiteSeer
noise_type: symmetric
noise_rates:
  - 0.0
  - 0.2
  - 0.4
seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
split:
  planetoid:
    split_mode: planetoid
    split_seed: 0
  medium_label:
    split_mode: ratio
    split_seed: 0
    train_ratios:
      - 0.1
      - 0.2
    val_ratio: 0.1
alpha_max:
  - 0.3
  - 0.5
primary_alpha: 0.3
methods:
  - ce
  - global
  - kmeans
  - topk_matched
  - gb
  - gb_prior
min_train_per_ball: 3
prior_gamma: 1.0
medium_label_trigger_coverage: 0.3
gb_min_ball_size: 5
gb_min_radius_gain: 0.01
classifier:
  epochs: 500
  learning_rate: 0.01
  weight_decay: 0.0005
  patience: 50
