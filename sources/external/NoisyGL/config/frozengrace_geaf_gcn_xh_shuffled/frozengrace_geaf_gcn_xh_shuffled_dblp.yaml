model:
  method: frozengrace_geaf_gcn_xh_shuffled
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  embedding_path: "../../gb_graph_aware_minival_6_1/checkpoints/embeddings_v2/DBLP/grace/H.pt"
  ball_mode: size_adaptive_ellipsoid
  min_train_per_ball: 2
  min_majority_confidence: 0.0

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
