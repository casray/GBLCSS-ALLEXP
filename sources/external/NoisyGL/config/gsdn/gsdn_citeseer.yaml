model:
  method: gsdn
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false
  graph_batch_size: 512
  lambda_feature: 0.8
  lambda_label: 0.8
  lambda_negative: 0.1
  mixup_init: 0.5

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
