model:
  method: frozengrace_gb_mlp_softdist_beta05_expand
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  embedding_path: "../../gb_graph_aware_minival_6_1/checkpoints/embeddings_v2/PubMed/grace/H.pt"
  max_balls: 64
  min_ball_size: 32
  split_improvement: 0.05
  min_train_per_ball: 2
  alpha_baseline: multiclass
  target_mode: distribution
  target_beta: 0.5
  lambda_u: 0.1
  expansion_builder: ball
  expansion_min_train_per_ball: 10
  expansion_margin_threshold: 0.5
  expansion_target_beta: 0.5

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
