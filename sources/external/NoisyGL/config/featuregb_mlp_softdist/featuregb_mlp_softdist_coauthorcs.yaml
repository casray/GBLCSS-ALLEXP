model:
  method: featuregb_mlp_softdist
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  ball_feature_source: x
  max_balls: 256
  min_ball_size: 32
  split_improvement: 0.001
  min_train_per_ball: 2
  alpha_baseline: multiclass
  target_mode: distribution

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
