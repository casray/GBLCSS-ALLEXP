model:
  method: mlp_gmm_ct
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false
  ct_warmup: 30
  ct_alpha: 0.01
  ct_p_threshold: 0.5
  ct_reg_covar: 5.0e-4

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false

