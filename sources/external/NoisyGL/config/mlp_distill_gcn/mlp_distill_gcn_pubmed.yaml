model:
  method: mlp_distill_gcn
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  embedding_path: "../../gb_graph_aware_minival_6_1/checkpoints/embeddings_v2/PubMed/grace/H.pt"
  teacher_hidden: 64
  teacher_n_layer: 2
  teacher_dropout: 0.5
  teacher_lr: 1e-2
  teacher_weight_decay: 5e-4
  teacher_epochs: 200
  distill_temperature: 1.0

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
