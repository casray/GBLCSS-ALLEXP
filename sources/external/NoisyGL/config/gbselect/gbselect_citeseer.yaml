model:
  method: gbselect
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  embedding_path: "../../gb_graph_aware_minival_6_1/checkpoints/embeddings_v2/CiteSeer/grace/H.pt"
  max_balls: 64
  min_ball_size: 32
  split_improvement: 0.05
  min_train_per_ball: 2
  keep_ratio: 0.6
  warmup_epochs: 10
  warmup_window_start: 5
  warmup_window_end: 10

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
