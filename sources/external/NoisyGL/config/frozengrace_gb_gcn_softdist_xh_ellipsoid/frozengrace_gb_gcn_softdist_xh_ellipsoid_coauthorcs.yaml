model:
  method: frozengrace_gb_gcn_softdist_xh_ellipsoid
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  embedding_path: "../../gb_graph_aware_minival_6_1/checkpoints/embeddings_v2/CoauthorCS/grace/H.pt"
  max_balls: 256
  min_ball_size: 32
  split_improvement: 0.001
  min_train_per_ball: 2
  alpha_baseline: multiclass
  target_mode: distribution
  softdist_weighting: ellipsoid
  ellipsoid_ridge_scale: 0.05
  ellipsoid_weight_floor: 0.1

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
