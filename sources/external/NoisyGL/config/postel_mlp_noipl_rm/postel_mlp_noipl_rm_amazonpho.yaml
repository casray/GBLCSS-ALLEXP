model:
  method: postel_mlp_noipl_rm
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false
  soft_label_ratio: 0.8
  smoothing_ratio: 0.4
  degree_cutoff: 1
  temperature: 1.0
  iterative_pseudo_labeling: false
training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric
dataset:
  sparse: true
analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
