model:
  method: ffg2m_reimplemented
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false
  teacher_hidden: 64
  teacher_n_layer: 2
  teacher_dropout: 0.5
  teacher_epochs: 200
  teacher_lr: 1.0e-2
  teacher_weight_decay: 5.0e-4
  ffg2m_lambda: 0.4
  ffg2m_tau: 1.5

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false

