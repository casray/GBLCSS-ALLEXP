model:
  method: frozengrace_gb_mlp_softdist_ellipsoid_pca_shrinkage_beta05
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

gb:
  embedding_path: "../../gb_graph_aware_minival_6_1/checkpoints/embeddings_v2/AmazonPhoto/grace/H.pt"
  max_balls: 64
  min_ball_size: 32
  split_improvement: 0.05
  min_train_per_ball: 2
  alpha_baseline: multiclass
  target_mode: distribution
  target_beta: 0.5
  softdist_weighting: ellipsoid_pca_shrinkage
  ellipsoid_feature_space: fullH
  ellipsoid_covariance_estimator: ridge
  ellipsoid_ridge_scale: 0.05
  ellipsoid_weight_floor: 0.1
  ellipsoid_distance_temperature: 1.0

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false

