model: {method: mlp_distill_gcn_xh_lcss_small_loss, n_hidden: 64, n_layer: 2, act: F.relu, dropout: 0.5, norm_info: ~, input_layer: false, output_layer: false}
training: {lr: 1e-2, weight_decay: 5e-4, n_epochs: 200, patience: ~, criterion: metric}
dataset: {sparse: true}
