model:
  method: mlp_anl_ce
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false
  anl_alpha: 5.0
  anl_beta: 5.0
  anl_delta: 5.0e-5
  anl_min_prob: 1.0e-7

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric

dataset:
  sparse: true

analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false

