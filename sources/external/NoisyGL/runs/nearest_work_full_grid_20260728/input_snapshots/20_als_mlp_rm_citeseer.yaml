model:
  method: als_mlp_rm
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false
  lp_steps: 2
  lp_residual: 0.5
  kl_weight: 1e-3
  pacing: exponential
  pacing_initial: 0.1
  pacing_rate: -1e-3
  alpha_max: 0.1
training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 200
  patience: ~
  criterion: metric
dataset:
  sparse: true
analysis:
  flag: false
  project: gnn-with-label-noise
  save_graph: false
