dataset: Cora
method: C1
ssl_objective: negfree
variant: negfree_bn
experiment_group: stage_c_smoke
seed: 0
device: auto

# Phase 1: SSL pretraining (same as B0)
epochs: 1000
warmup_epochs: 300
hidden_dim: 256
proj_dim: 256
lr: 0.001
weight_decay: 0.00001
edge_drop: 0.2
feat_mask: 0.2
edge_drop_1: 0.2
edge_drop_2: 0.4
feat_mask_1: 0.3
feat_mask_2: 0.4
lambda_gb: 0.0

# Ball construction
ball_space: H
ball_algorithm: gain_split
gain_split_min_ball_size: 5
gain_split_max_depth: 20
gain_split_min_gain: 0.001
reliable_ball_min_size: 3
reliable_ball_max_size: 256
reliable_ball_ad_percentile: 90.0

# Noise injection
noise_rate: 0.4

# Phase 2: GB-supervised fine-tuning
phase2_epochs: 200
phase2_lr: 0.0001
lambda_intra: 1.0
lambda_inter: 1.0
lambda_sce: 1.0
phase2_ball_refresh: 20
phase2_label_smoothing: 0.1

results_dir: results
